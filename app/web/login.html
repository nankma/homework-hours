<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework Hours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #f3f5f8; --surface: #ffffff; --line: #d9dee7; --fg: #1c2433; --muted: #5d6779;
  --accent: #2b4c7e; --stop: #b3372f; --stop-soft: #f9e2df;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161f; --surface: #1a2130; --line: #2c3547; --fg: #e6eaf2; --muted: #9aa4b6;
    --accent: #8fb0e6; --stop: #f08a80; --stop-soft: #3d1f1d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding: 24px 16px; }
main { width: 100%; max-width: 380px; display: grid; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
button { font: inherit; font-weight: 700; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.error { background: var(--stop-soft); color: var(--stop); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Homework Hours</h1>
    <p class="note">Internet rules for the wireless network</p>
  </div>
  <form class="card" id="f">
    <label>Name<input id="name" autocomplete="username" required autofocus></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <div class="error" id="err" hidden></div>
    <button id="go">Sign in</button>
    <p class="note">Use your AdGuard Home account. You stay signed in on this device for 30 days.</p>
  </form>
  <p class="note">Seeing a security warning? <a href="/ca.crt">Download the home certificate</a> and install it on this device once, then the warning goes away.</p>
</main>
<script>
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.hidden = true; go.disabled = true; go.textContent = "Signing in…";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: document.getElementById("name").value, password: document.getElementById("pw").value }) });
    if (r.ok) { location.href = "/"; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || "Sign-in failed.";
  } catch { err.textContent = "Can't reach the CM4. Check that this device is on the home network."; }
  err.hidden = false; go.disabled = false; go.textContent = "Sign in";
});
</script>
</body>
</html>
